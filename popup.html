<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Disney Photo Pass Downloader</title>
    <style>
        body {
            width: 260px;
            font-family: system-ui, sans-serif;
            font-size: 13px;
            margin: 12px;
        }
        button {
            width: 100%;
            padding: 8px;
            cursor: pointer;
        }
        #status {
            margin-top: 10px;
            line-height: 1.35;
        }
        #status.error {
            color: #b00020;
        }
        #status.success {
            color: #0d6b0d;
        }
    </style>
</head>
<body>
    <button id="extractBtn" type="button">Download visible photos</button>
    <p id="status">Open your PhotoPass gallery first, then click the button.</p>
    <script src="popup.js"></script>
</body>
</html>
